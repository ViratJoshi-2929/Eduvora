<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Eduvora is a modern study platform for students to plan study sessions, manage tasks, track goals, stay focused and organize their study journey."
    >

    <meta
        name="robots"
        content="index, follow"
    >

    <meta
        name="author"
        content="Eduvora"
    >

    <meta
        name="theme-color"
        content="#5b5ff0"
    >

    <meta
        name="application-name"
        content="Eduvora"
    >

    <title>Eduvora — Study Smarter</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>
    <div id="app" class="app-shell">

        <aside class="sidebar" id="sidebar" aria-label="Main navigation">
            <div class="brand">
                <div class="brand-logo">E</div>
                <div>
                    <h1>EduVora</h1>
                    <span>Study smarter.</span>
                </div>
            </div>

            <nav class="navigation">
                <div class="nav-group">
                    <p class="nav-section-title">Workspace</p>
                    <button class="nav-item active" type="button" data-page="dashboard">
                        <span class="nav-icon">⌂</span>
                        <span>Dashboard</span>
                    </button>
                    <button class="nav-item" type="button" data-page="tasks">
                        <span class="nav-icon">✓</span>
                        <span>Tasks</span>
                    </button>
                    <button class="nav-item" type="button" data-page="planner">
                        <span class="nav-icon">▦</span>
                        <span>Planner</span>
                    </button>
                    <button class="nav-item" type="button" data-page="goals">
                        <span class="nav-icon">◎</span>
                        <span>Goals</span>
                    </button>
                </div>

                <div class="nav-group">
                    <p class="nav-section-title">Study</p>
                    <button class="nav-item" type="button" data-page="focus">
                        <span class="nav-icon">◷</span>
                        <span>Focus</span>
                    </button>
                    <button class="nav-item" type="button" data-page="analytics">
                        <span class="nav-icon">▥</span>
                        <span>Analytics</span>
                    </button>
                    <button class="nav-item" type="button" data-page="achievements">
                        <span class="nav-icon">★</span>
                        <span>Achievements</span>
                    </button>
                </div>

                <div class="nav-group">
                    <p class="nav-section-title">Account</p>
                    <button class="nav-item" type="button" data-page="profile">
                        <span class="nav-icon">○</span>
                        <span>Profile</span>
                    </button>
                    <button class="nav-item" type="button" data-page="settings">
                        <span class="nav-icon">⚙</span>
                        <span>Settings</span>
                    </button>
                </div>
            </nav>

            <div class="sidebar-footer">
                <div class="sidebar-status">
                    <span class="status-dot"></span>
                    <div>
                        <strong>EduVora</strong>
                        <small>Your study journey</small>
                    </div>
                </div>
            </div>
        </aside>

        <main class="main">
            <header class="topbar">
                <button class="menu-button" id="menuButton" type="button" aria-label="Open navigation">☰</button>

                <div class="page-heading">
                    <span id="pageLabel">Dashboard</span>
                </div>

                <div class="topbar-actions">
                    <button class="icon-button" id="themeButton" type="button" aria-label="Toggle theme" title="Toggle theme">☾</button>
                    <button class="profile-button" id="profileButton" type="button" aria-label="Open profile">V</button>
                </div>
            </header>

            <section class="content" id="pageContent" aria-live="polite"></section>
        </main>
    </div>

    <div class="overlay" id="overlay" aria-hidden="true"></div>
    <div id="modalRoot"></div>
    <div class="toast-container" id="toastContainer" aria-live="polite"></div>

    <footer style="
    padding: 24px 36px 36px;
    text-align: center;
    color: var(--text-secondary);
    font-size: 12px;
">

    <p>
        Eduvora — Study Smarter
    </p>

    <p style="margin-top: 8px;">

        <a
            href="study-planner.html"
            style="
                color: var(--primary);
                text-decoration: none;
                font-weight: 650;
            "
        >
            Study Planner for Students
        </a>

    </p>

</footer>

    <script src="script.js"></script>
</body>
</html>
